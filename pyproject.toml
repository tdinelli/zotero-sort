[project]
name = "zotero-sort"
version = "0.1.0"
description = "Claude Code skill helper: file Zotero Inbox items into collections via the Web API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Timoteo Dinelli", email="tdinelli@stanford.edu"}]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
zotero-sort = "zotero_sort.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize code)
    "B",      # flake8-bugbear (catch common bugs)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # use ternary operator (if/else is often clearer)
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
